# M1e comparator baselines, dev data only (DESIGN v0.4 §2, §6). Generated by hand from scripts/baselines/run_searches.py.
node: gpu-node (32 affinity cores of 2x EPYC 9354, Zen 4; A100 80GB unused by comparators; 1.5 TB RAM); fingerprint in timings.jsonl ("hw") and env.txt
tools:
  sage: tools/bin/sage (0.14.7, commit 99407db6; prints 0.14.6), built-in LDA, predict_rt: true, chimera: false, report_psms: 1, batch-size = min(n_files, threads)
  sage+mokapot: Sage --write-pin -> mokapot 0.10.0 (pinned env /tmp/vulcan_m1e/envs/mokapot, rebuilt by setup_mokapot_env.sh), --seed 11, --max_workers 1, --keep_decoys, --aggregate when >1 PIN
  comet+mokapot: Comet 2026.01 rev.1 (e4f767c) output_percolatorfile -> mokapot as above
  conversion: ThermoRawFileParser 2.0.0.0 -f 2 (indexed mzML, vendor peak picking, zlib), 1 thread, timed separately
search:
  enzyme: trypsin KR/P, <=2 missed cleavages, length 7-50, mass 500-5000 Da, precursor charge 2-4 (Comet 1-6), isotope errors 0..2
  mods: static C+57.021464 (D4 also TMT 229.162932 on K and N-term), variable M+15.9949 (max 2)
  precursor_tol_ppm: 10
  fragment_tol: {D0: 20 ppm, D1: 20 ppm, D4: 0.5 Da (ion-trap CID; Comet bin 1.0005, offset 0.4)}
  databases: human SwissProt canonical + Frankenfield contaminants (D0, D4); Pfu UP000001013 + contaminants (D1)
  production (prod): protein FASTA, engine-native decoys (Sage generate_decoys reversed peptides; Comet decoy_search=1)
  augmented: peptide-level FASTA searched without cleavage, external decoys (prefix rev_): T+dec(T)+E+dec(E)
datasets:
  D0: PXD001468, b1906_01A + b1937_01B (2 files)
  D1: PXD001077, Velos005137 (1 file)
  D4: PXD016766, dq_00095_..._A1 and dq_00101_..._B1 (2 of 12 files; DEVIATION, see NOTES)
entrapment:
  P: FDRBench 1.1.1 -level peptide -I2L -fix_nc c -enzyme 1 -miss_c 2 -minLength 7 -maxLength 50 -check -fold 1, seeds [2001, 2002, 2003], + hash-seeded repairs (DECOY_SEEDS 1001-1005 uniqueness)
  C: D0/D4 Arabidopsis UP000006548 (homolog filter); D1 human SwissProt
  S (decoy variability): T + C-term-fixed hash(peptide, seed, k) shuffled decoys, DECOY_SEEDS [1001..1005], external decoys; Sage D0/D1/D4, Comet D1
decoy_seed_for_collision_repairs: 1001
stats: vulcan.stats.{entrapment,tdc,protein}; evaluate_arm n_boot=2000, seed 11; picked_group_fdr seed 11, rescue on; alphas [0.1%, 0.5%, 1%, 5%]
threads: pass 1 = 32 (affinity); pass 2 = 4 via VULCAN_THREADS=4 (Sage prod,P2001 all datasets; Comet prod all datasets, Comet P2001 D1 only)
lock: flock /tmp/vulcan_bench.lock around every timed prod/P2001 run (and conversions); other DBs timed but unlocked
