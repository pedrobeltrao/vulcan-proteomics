# Scoring-speed study (dev only). Frozen scorer static_gbm_pred (DESIGN §6.0 A1.1): model, features, NCE grid,
# competition and protein estimators unchanged. Nothing sealed touched; no T1/T4 data.
scorer:
  model: results/2026-10-27_M3_scoring/models/static_gbm_pred.pkl   # sklearn HistGradientBoostingClassifier, 150 trees
  features: vulcan.rescore.static.BASE_FEATURES + PRED_FEATURES (31)
  predictor: AlphaPeptDeep generic (peptdeep 1.5.1, pretrained_models_v3.zip sha256 345cb241...), fp32, batch 16384
  nce: per-run label-blind choice over NCE_GRID (20,23,26,29,32,35) by median spectral angle of <=2000 top-decile
       hyperscore rank-1 PSMs (UNCHANGED; per-project caching not applied because it would change semantics)
  competition: vulcan.stats.tdc.double_competition(seed 11, hash tie-break on pf_id), per run
  proteins: vulcan.stats.protein.picked_group_fdr(seed 11) with the evaluate.protein_level inputs
data:
  D0: PXD001468 b1906 (warm-up, excluded from medians), b1937
  D1: PXD001077 Velos005137 (pfu_contam_prod index)
  D8: first 10 runs of data/manifests/e9_d8.tsv (M3e stores)
  index: /tmp/vulcan_e2/index/{human_contam,pfu_contam}_prod; search report_psms 5 (M3)
library:   # scripts/scoring_speed/build_library.py (one-time per proteome x instrument class)
  source: copy of the M3 prediction cache root (/tmp/vulcan_m3/predcache) -> /tmp/vulcan_ss/predlib
  precompute: PredCache.precompute (frozen code path, misses only) for every row of both prod indexes,
              RT + MS2 at z = 2,3,4, all 6 grid NCEs; z>=5 lazy
  consolidated: vulcan.predict.library.consolidate (first copy wins = PredCache lookup semantics), mmap at run time
optimizations_applied:
  - consolidated memory-mapped predicted library shared across runs/processes (vulcan/predict/library.py)
  - NCE-independent half of the fragment block computed once per run (not 6x); per-NCE blocks keep the frozen shapes
  - spectrum peak table built on GPU (stable sort; exact TIC/min/max on host via numba)
  - prediction scatter on GPU; single D2H copy of features
  - GBM decision_function on GPU, float64, sklearn's rule and summation order (bit-identical)
  - competition + picked proteins in torch-free post worker processes in the cohort (estimators unchanged)
  - lazy misses: one predictor call for all charges (values for misses depend on batch composition at 1-ulp fp16, as
    in the frozen cache)
optimizations_rejected:
  - autocast fp16/bf16 predictor: 19-24% of stored MS2 values change (max 0.26/0.65), RT changes -> rejected
  - larger predictor batches: identical outputs but no faster (49-51k vs 57k MS2/s) -> kept batch 16384
  - per-instrument/project NCE: changes semantics (frozen pipeline chooses per run) -> not applied
  - RT keyed independently of NCE: would change values (RT is cached per NCE key) -> not applied
timing:
  lock: flock /tmp/vulcan_bench.lock around each timed process (profile_before, bench_after x2, gpuprof, each cohort)
  clocks: wall perf_counter with cuda.synchronize at sub-stage edges; core-s getrusage(SELF) deltas; GPU-s = CUDA
          kernel time from torch.profiler (separate pass)
  env: $VULCAN_SCRATCH/vulcan_env/pred (staged NVMe), PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True (after runs)
seeds: 11 (competition/protein tie-break), predictor-precision sample seed 1
