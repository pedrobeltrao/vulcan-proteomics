[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan"
version = "0.0.1"
description = "Vulcan: repository-scale MS proteomics engine (see DESIGN.md)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vulcan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: >=1e4-replicate Monte-Carlo tests (run with --runslow)"]
