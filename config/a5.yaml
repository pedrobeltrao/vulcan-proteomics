  status_path: results/2026-10-28_A6_hn1/a6_status.json
  enum:
  - PASS
  - FAILED
  - not evaluable
  - invalid pool
  - not completed
  - label-free stop
  - not tagged
  - 'stopped: node time limit'
  absent_state: 'stopped: node time limit'
  schema:
    status: one of enum
    step5_commit: git sha (7-40 hex) or null
    gate_output_sha256: 64 hex or null
    gate_output_path: repo path of the gate output (required for PASS and FAILED)
  read_rule: 'read with `git show <look base commit>:<status_path>` (committed when the look starts); absent, unparseable, status outside the enum, malformed sha fields, or (PASS only) unverifiable gate output / step-5 commit not an ancestor of the base commit -> ''stopped: node time limit''. A FAILED status is kept even if its gate output cannot be verified (stricter: it can only void).'
