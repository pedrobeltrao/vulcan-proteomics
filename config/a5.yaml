claim_script_stricter_readings:   # A5.11.4.3: dated 2026-10-28, before the look; recorded here so `deviations` stays the retry list (empty at the tag). Revised after reviews/claims_a5_review.md (e757c30).
  - '2026-10-28: LOO minimum None (one run or an undefined LOO ratio) does not clear any bar (family S, P1(i)).'
  - '2026-10-28: Matched-FDP ratio not evaluable also when fdp_reached is not True on both sides or the CI is not finite (A5.5.4 names only >5% NaN draws).'
  - '2026-10-28: v2_sep void: union of a3_secondary.void_flags and a recomputation from the per-arm verdicts.'
  - '2026-10-28: Family S S1 with no ''supported'' own-q comparator: S1''s own-q part is not met, so S1 is not rejected and the sequence stops (A3.3.5 gives the ''not tested'' rule for S5 only; A5.9.2''s ''rests on (i)'' is written for P1 only).'
  - '2026-10-28: A6 FAILED keeps the FAILED state even if its gate output cannot be verified (it can only void); this departs from A6.2''s literal ''unverifiable -> stopped'' and needs PI confirmation as a deviation. PASS needs a verifiable gate output and a step-5 commit that is an ancestor of the look base commit, else ''stopped: node time limit''.'
  - '2026-10-28: A6 PASS also needs its step-5 commit dated no later than the A6 clock''s step-5 deadline (config a6.pass_deadline, 17:55 CET 2026-10-28; A6.8.2/D31.3), else ''stopped: node time limit''.'
  - '2026-10-28: A6 is v1-only (D32): v2_sep wording (L-Q, L-R, title) is always the no-A6 wording; its C9 clause says so; the A5.7.2 ''v2_sep FAILED a completed null-spectrum test'' trigger has no input and cannot fire (stated in claims.md).'
  - '2026-10-28: In the A6 PASS state the designation is not changed by this script (A5.10.6 is a separate act); the L-D label is printed unchanged with that note.'
  - '2026-10-28: Arm M (T5) verdicts enter L-E for v1/v2_sep lists at peptidoform and sequence; ''not applicable to this unit'' at protein level.  Arm M has no paired control, so ''(consistent with control)'' is never attached to it.'
  - '2026-10-28: Sealed run counts (6 T1, 2 T5) and 15 arm-M replicates are part of the completeness rule; sealed inputs require the ledger manifest hashes (run() refuses without them).'
  - '2026-10-28: Claim-level arm-C void also when the arm-C LB lower CI is missing or not finite.'
  - '2026-10-28: Headline comparator: the lowest FINITE P1(i) point ratio; a None ratio (0 comparator IDs) never headlines; ties by comparator name; with no finite ratio the first A1 comparator by name is named.'
  - '2026-10-28: A5.9.3 PASS wording: the ''(…)'' of L-S''s pass clause is filled with ''(A1, 2026-10-27: tail-G2, G1, G3)'', the gates named in A5.4.'
  - '2026-10-28: Own-q ratios carry no n_boot_nan: evaluate.py floors the comparator denominator at 1e-9, so an own-q bootstrap draw cannot be NaN; A5.5.4''s ''every bootstrap''s n_boot_nan'' is read as every matched-FDP bootstrap.'
  - '2026-10-28: A void (scorer-level or claim-level) is reported as ''VOID'', never as ''not met''/''not rejected''; voided numbers are printed in full under captions titled ''VOID under §6.0d A5.7 (reason)''.'
