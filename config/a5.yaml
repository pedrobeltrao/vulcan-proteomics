labels:
  L-G_v1:
    text: 'Null-spectrum gates: A1 (2026-10-27): tail-G2, G1, G3 FAILED; final for those nulls. A post-hoc contamination explanation exists, is unconfirmed, and is not used. A2 (DN2): not evaluable before any test (D24). A4 (DN3): drafted and reviewed twice, then not run by PI decision D28 (2026-10-28), made before any DN3 listing and before any T1 look, on label-free feasibility grounds: P(v1 evaluable) 0.08–0.43 in the reference cell (grid 0.01–0.98). {C9 clause} Passed: G0 (D0/D1), G4 (dev decoys), G2-original and G5 (A1 null set; G2-original nearly vacuous for a re-scorer), §6.7 estimator simulations; arm M (dev D7): inconclusive, not violated.'
  C9_clause_nogo:
    text: 'C9 removed-peptide pilot: NO-GO (P(v1 minimum) = x < 0.8, commit c); not run.'
  C9_clause_timebox:
    text: 'C9 pilot: no verdict within the time box; not run.'
  C9_clause_a6:
    text: 'A6 (removed-peptide human nulls, test 2 at α/2): PASS | FAILED | not evaluable | not completed (time box) (commit c), before T1.'
  L-G_v2_sep:
    text: 'v2_sep: no null-spectrum test completed (DN2 not evaluable before any test; A4 not run) {C9 clause for v2_sep}. Passed: G0 at freeze (D1), G2-original and G5 (M3 mixtures, chimeric), G4 (weak, training decoys), §6.7 MC; arm M (dev D7): no violated list.'
  L-E:
    text: 'arm P: <verdict>; arm C: <verdict | not computed at protein level>; arm M (T5): <verdict | not applicable to this unit> (<unit>, α = <α>)'
  L-M:
    text: 'compared at matched arm-P (shuffled paired entrapment) FDP̂ = f; each method''s own q is used only to order its list, not as an error estimate; the comparison rests on the entrapment assumptions; arm P cannot detect a preference for natural sequences; arm C for the same list at the same threshold: mean FDP̂ = x%, LB lower CI = y% [protein level: arm C not computed].'
  L-Q:
    text: at the method's own q; estimator validity for this scorer is not established by null-spectrum tests (A1 FAILED).
  L-R:
    text: top-K re-ranking by the static scorer is used although A1.8's precondition (tail-G2/G1/G3 pass) is not met (rank-1 changed in p% of spectra, q% of accepted units).
  L-S:
    text: 'FDR-filtered at the method''s own threshold and checked by entrapment (verdicts as stated); not validated by null-spectrum tests: the only completed test (A1) FAILED.'
  L-2:
    text: pre-registered secondary arm; not gate-validated; compared against every comparator in the look, including Sage chimera at narrow precursor tolerance; per-stratum statements name the merged block.
  L-D:
    text: 'v1: engine default, FDR not validated by null-spectrum tests. v2_sep: candidate. No OT-HCD scorer has gate-validated FDR claims.'
  L-P:
    text: null-spectrum gates passed after T1 was seen (<amendment>, test k at α/2^(k−1))
  L-S_last_clause_a6_verdict:
    text: A1 FAILED; A6 <verdict>
  L-S_pass_last_clause:
    text: passed null-spectrum gates at its second completed test (A6, α/2) before T1, after A1 FAILED (…)
  L-Q_pass_last_clause:
    text: validated by A6 (test 2), after A1 FAILED
  L-R_pass:
    text: top-K re-ranking by the static scorer; A1.8's precondition met at test 2 (A6), before T1.
  A1.8_statement:
    text: top-K re-ranking by the static scorer is used although A1.8's precondition (tail-G2/G1/G3 pass) is not met.
  v2_sep_title:
    text: Secondary arm; not gate-validated
  v2_sep_title_a6_pass:
    text: Secondary arm; null-spectrum gates passed under A6 (first test)
  stratum1_title:
    text: v2_sep stratum-1 list (descriptive; not family S)
  void_title:
    text: VOID under §6.0d A5.7 (reason)
  R4:
    text: secondary arm C (D18 screen); reported only
  posthoc_title:
    text: post-hoc, not pre-registered
  narrow_tolerance:
    text: compared against Sage chimera **at narrow precursor tolerance**
  E7b_rank_caveat:
    text: the comparator's rank ≥ 2 IDs were miscalibrated on dev (4–13% FDP at nominal 1%), so these ratios favour the comparator
  D14_limitation:
    text: on dev, the natural-proteome (arm C) estimate sat at 1.1–1.2% at α = 1% (D14); 3g found no decoy-realism defect (D18); human paralog neighbours are unmeasured (D18)
  void_power:
    text: '"Violated" needs the lower CI of LB above α. At r ≈ 1, LB ≈ FDP̂_C / 2. So the void rules fire only against a **gross** violation: true FDP of roughly ≥ 2α in arm C, and similarly for arm M. They are a backstop, not a validation.'
  D25_s3_dev:
    text: D8h's 0.999 [0.951, 1.039]
